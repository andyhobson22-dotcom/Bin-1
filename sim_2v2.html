<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2v2 Rugby Simulator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#0a0e13;--bg2:#12171e;--bg3:#1a2230;--text1:#f0f4f8;--text2:#94a3b8;--text3:#4a5568;--blue:#3b82f6;--red:#ef4444;--green:#22c55e;--yellow:#eab308;--border:#1e293b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text1);height:100vh;display:flex;flex-direction:column}

.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1em;font-weight:700}
.header .score{font-size:1.4em;font-weight:800}
.header .info{font-size:0.75em;color:var(--text3)}

.pitch-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#0d120d;position:relative;overflow:hidden}
canvas{display:block;max-width:100%;max-height:100%}

.event-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.2em;font-weight:800;opacity:0;pointer-events:none;transition:opacity 0.3s;text-shadow:0 2px 20px rgba(0,0,0,0.8)}
.event-label.show{opacity:1}

.comm-area{background:var(--bg2);border-top:1px solid var(--border);height:160px;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:2px}
.comm{font-size:0.76em;line-height:1.4;color:var(--text2);padding:2px 0}
.comm b{color:var(--text1);font-weight:600}
.comm.try{color:var(--green);font-weight:600}
.comm.turnover{color:#f97316;font-weight:600}
.comm.tackle{color:var(--yellow)}
.comm.penalty{color:var(--yellow);font-weight:600}

.controls{background:var(--bg2);border-top:1px solid var(--border);padding:8px 16px;display:flex;gap:10px;align-items:center;justify-content:center}
.btn{padding:8px 20px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:0.85em;font-weight:600;cursor:pointer}
.btn:hover{background:#2563eb}
.btn.reset{background:var(--bg3)}
.speed-label{font-size:0.72em;color:var(--text3)}
</style>
</head>
<body>

<div class="header">
    <div>
        <h1>2v2 Rugby Simulator</h1>
        <div class="info" id="state-info">Kickoff</div>
    </div>
    <div class="score" id="score">0 - 0</div>
    <div class="info" id="zone-info">Zone: Midfield</div>
</div>

<div class="pitch-wrap">
    <canvas id="pitch" width="800" height="400"></canvas>
    <div class="event-label" id="flash"></div>
</div>

<div class="comm-area" id="comm"></div>

<div class="controls">
    <button class="btn" id="btn-start" onclick="startSim()">Start</button>
    <button class="btn reset" onclick="resetSim()">Reset</button>
    <span class="speed-label">Speed:</span>
    <button class="btn reset" onclick="setSpeed(2000)">Slow</button>
    <button class="btn reset" onclick="setSpeed(1000)">Normal</button>
    <button class="btn reset" onclick="setSpeed(400)">Fast</button>
</div>

<script>
/*
  2v2 Rugby Simulator — CM-style state machine
  (double-click this file to open it in a browser — no server needed)

  Core loop:
  1. Ball carrier RUNS forward toward defenders (dots move in real time);
     the support runner holds depth BEHIND him, defenders track him laterally
  2. Carrier MEETS tackler — engine resolves: beat or tackled? (stats vs stats)
  3. If BEATEN — carrier keeps running past, defender slides behind
  4. If TACKLED — both players go to ground. Does he PASS/OFFLOAD first?
  5. If PASS succeeds — ball moves to support runner, who runs at other defender
  6. If no pass — RUCK: rucking+strength vs jackling contest decides
     fast ball / slow ball / turnover / penalty, then play restarts
  7. Every contest drains FATIGUE (bar under each name) — tired players
     move slower and lose contests more often; idle time recovers a little

  All movement is smooth via requestAnimationFrame.
  The engine queues actions that play out visually over time.
*/

// ── Players (subset of stats relevant to 2v2) ──
const players = {
    atk1: {
        name:"Tom Curry", num:7, color:"#3b82f6",
        pace:74, acceleration:78, agility:68, strength:82,
        stopping_power:78, explosiveness:80,
        awareness:80, composure:72, scanning:78,
        handling:65, offload:58, tackling:92, stepping:52,
        short_passing:55, rucking:88, jackling:90, discipline:70,
        fatigue:0, grounded:0,
        x:0, y:0, tx:0, ty:0, hasBall:true
    },
    atk2: {
        name:"Arron Reed", num:14, color:"#3b82f6",
        pace:92, acceleration:90, agility:85, strength:45,
        stopping_power:32, explosiveness:88,
        awareness:55, composure:58, scanning:48,
        handling:62, offload:42, tackling:42, stepping:82,
        short_passing:38, rucking:35, jackling:30, discipline:65,
        fatigue:0, grounded:0,
        x:0, y:0, tx:0, ty:0, hasBall:false
    },
    def1: {
        name:"Tommy Reffell", num:7, color:"#ef4444",
        pace:68, acceleration:65, agility:58, strength:68,
        stopping_power:62, explosiveness:68,
        awareness:72, composure:58, scanning:72,
        handling:52, offload:45, tackling:85, stepping:38,
        short_passing:42, rucking:82, jackling:94, discipline:62,
        fatigue:0, grounded:0,
        x:0, y:0, tx:0, ty:0, hasBall:false
    },
    def2: {
        name:"Freddie Steward", num:15, color:"#ef4444",
        pace:72, acceleration:72, agility:75, strength:42,
        stopping_power:35, explosiveness:70,
        awareness:78, composure:75, scanning:72,
        handling:75, offload:38, tackling:65, stepping:62,
        short_passing:55, rucking:45, jackling:40, discipline:80,
        fatigue:0, grounded:0,
        x:0, y:0, tx:0, ty:0, hasBall:false
    }
};
const P = players;
const all = [P.atk1, P.atk2, P.def1, P.def2];

/* ═══════════════ PURE-ENGINE-START ═══════════════
   Pure, testable contest resolvers. No DOM, no side effects.
   Every number traces to a player stat. Extractable for headless
   testing:  see runHarness() at the bottom of this block.        */

function roll(n){return Math.floor(Math.random()*n)+1}
function chance(p){return Math.random()*100<p}

// Tuning constants (set from harness distributions — see commit log)
const DEF_LINE_BONUS = 6;      // organised defender advantage
const BREAK_THRESHOLD = 14;    // diff needed for a clean break
const SMASH_THRESHOLD = -12;   // diff at/below which the hit is dominant
const OFFLOAD_DIFFICULTY = 4;  // flat difficulty on offload attempts

// ── Fatigue model (A.4) ──
// fatigue runs 0 (fresh) → 100 (spent). At 100 a player loses
// FATIGUE_CONTEST_SCALE points off every contest score and moves
// FATIGUE_SPEED_SCALE (35%) slower.
const FATIGUE_CONTEST_SCALE = 12;
const FATIGUE_SPEED_SCALE = 0.35;

function fatiguePenalty(p) {
    return ((p.fatigue || 0) / 100) * FATIGUE_CONTEST_SCALE;
}
function fatigueSpeedFactor(p) {
    return 1 - ((p.fatigue || 0) / 100) * FATIGUE_SPEED_SCALE;
}

// ── Ruck model (A.3) ──
const RUCK_BALL_BONUS = 10;      // possession advantage: attack is over the ball first
const RUCK_SUPPORT_WEIGHT = 0.5; // later arrivals contribute half weight
const RUCK_FAST_THRESHOLD = 25;  // diff needed for quick ball
const RUCK_TURNOVER_THRESHOLD = -18; // diff at/below which the ball is stolen
const RUCK_FAST_FRAMES = 25;     // reset delay after quick ball
const RUCK_SLOW_FRAMES = 80;     // reset delay after slow ball

// First arriver counts fully, later arrivals at RUCK_SUPPORT_WEIGHT.
// Attack clears with rucking + strength; defence contests with
// jackling first, then rucking + strength.
function ruckAttackScore(p) {
    return p.rucking*0.55 + p.strength*0.45 - fatiguePenalty(p);
}
function ruckDefendScore(p) {
    return p.jackling*0.55 + p.rucking*0.25 + p.strength*0.20 - fatiguePenalty(p);
}

// Discipline reduces penalty risk: an ill-disciplined side (worst
// offender counts) gives away ruck penalties more often.
function ruckPenaltyRisk(playersArr) {
    const worst = Math.min(...playersArr.map(p => p.discipline));
    return Math.max(0, (78 - worst) * 0.25); // % chance
}

// Ruck contest. atkPlayers/defPlayers: arrays ordered by arrival
// (carrier/tackler first). defBonus: extra defensive momentum, e.g.
// after a dominant hit. Returns {outcome, speed, diff, against?}
// where outcome is "fast"|"slow"|"turnover"|"penalty" and speed is
// the reset delay in frames the result earns.
function resolveRuckContest(atkPlayers, defPlayers, defBonus = 0) {
    // Infringement check first — jackler holding on / attacker sealing off.
    // Defenders infringe more (hands in the ruck, not rolling away).
    if (chance(ruckPenaltyRisk(defPlayers) * 1.4))
        return {outcome:"penalty", against:"defence", speed:RUCK_SLOW_FRAMES, diff:0};
    if (chance(ruckPenaltyRisk(atkPlayers)))
        return {outcome:"penalty", against:"attack", speed:RUCK_SLOW_FRAMES, diff:0};

    let atk = RUCK_BALL_BONUS, def = defBonus;
    atkPlayers.forEach((p, i) => atk += ruckAttackScore(p) * (i === 0 ? 1 : RUCK_SUPPORT_WEIGHT));
    defPlayers.forEach((p, i) => def += ruckDefendScore(p) * (i === 0 ? 1 : RUCK_SUPPORT_WEIGHT));
    const diff = (atk + roll(40) - 20) - (def + roll(40) - 20);

    if (diff <= RUCK_TURNOVER_THRESHOLD) return {outcome:"turnover", speed:RUCK_SLOW_FRAMES, diff};
    if (diff >= RUCK_FAST_THRESHOLD)     return {outcome:"fast",     speed:RUCK_FAST_FRAMES, diff};
    return {outcome:"slow", speed:RUCK_SLOW_FRAMES, diff};
}

// Carriers attack to their strengths: a power runner (Curry) runs over,
// an evasive runner (Reed) runs around. Use whichever profile is stronger.
function carryProfile(atk) {
    const power   = atk.strength*0.40 + atk.explosiveness*0.30 + atk.pace*0.15 + atk.agility*0.15;
    const evasive = atk.stepping*0.40 + atk.agility*0.30 + atk.acceleration*0.15 + atk.pace*0.15;
    return power >= evasive ? {score: power, style: "power"} : {score: evasive, style: "evasive"};
}

function tackleProfile(def) {
    return def.tackling*0.35 + def.stopping_power*0.20 + def.awareness*0.20
         + def.agility*0.15 + def.pace*0.10;
}

// Carry vs tackle contest.
// Returns {outcome: "break"|"tackled"|"smashed", diff, style}
function resolveCarryContest(atk, def) {
    const a = carryProfile(atk);
    const atkScore = a.score - fatiguePenalty(atk) + roll(25) - 13;
    const defScore = tackleProfile(def) - fatiguePenalty(def) + DEF_LINE_BONUS + roll(25) - 13;
    const diff = atkScore - defScore;
    let outcome;
    if (diff > BREAK_THRESHOLD) outcome = "break";
    else if (diff > SMASH_THRESHOLD) outcome = "tackled";
    else outcome = "smashed";
    return {outcome, diff, style: a.style};
}

// Does the tackled carrier even TRY the offload? Poor offloaders take
// the tackle and set the ruck instead. Makes the Offload stat visible.
function offloadAttemptChance(atk) {
    return Math.max(10, Math.min(75, atk.offload*0.8 + atk.composure*0.2));
}

// Offload in the tackle vs the tackler killing the ball.
// Returns {success, margin}
function resolveOffloadContest(atk, def) {
    const passScore = atk.offload*0.35 + atk.composure*0.25
                    + atk.awareness*0.20 + atk.handling*0.20
                    - fatiguePenalty(atk) + roll(20) - 10;
    const killScore = def.awareness*0.30 + def.strength*0.30 + def.tackling*0.25
                    + OFFLOAD_DIFFICULTY - fatiguePenalty(def) + roll(20) - 10;
    return {success: passScore > killScore, margin: passScore - killScore};
}

// Headless distribution harness — run in the browser console or via node.
// Prints outcome frequencies for every carrier/tackler matchup.
function runHarness(n = 2000) {
    const pairs = [
        [players.atk1, players.def1], [players.atk1, players.def2],
        [players.atk2, players.def1], [players.atk2, players.def2],
    ];
    const lines = [];
    let totBreak = 0;
    for (const [a, d] of pairs) {
        const c = {break:0, tackled:0, smashed:0};
        let offAtt = 0, offOk = 0;
        for (let i = 0; i < n; i++) {
            const r = resolveCarryContest(a, d);
            c[r.outcome]++;
            if (r.outcome === "tackled" && chance(offloadAttemptChance(a))) {
                offAtt++;
                if (resolveOffloadContest(a, d).success) offOk++;
            }
        }
        totBreak += c.break;
        lines.push(
            `${a.name} vs ${d.name}: break ${(c.break/n*100).toFixed(1)}% | ` +
            `tackled ${(c.tackled/n*100).toFixed(1)}% | smashed ${(c.smashed/n*100).toFixed(1)}% | ` +
            `offload ${offAtt ? (offOk/offAtt*100).toFixed(1)+"%" : "n/a"} of ${offAtt} attempts`
        );
    }
    lines.push(`AVERAGE break rate: ${(totBreak/(n*pairs.length)*100).toFixed(1)}%`);

    // ── Ruck outcome distributions (A.3) ──
    lines.push("— Ruck contests (carrier+support vs jackler[+cover]) —");
    const ruckSetups = [
        ["Curry carry vs Reffell alone",    [players.atk1, players.atk2], [players.def1]],
        ["Curry carry vs Reffell+Steward",  [players.atk1, players.atk2], [players.def1, players.def2]],
        ["Reed carry vs Reffell alone",     [players.atk2, players.atk1], [players.def1]],
        ["Reed carry vs Reffell+Steward",   [players.atk2, players.atk1], [players.def1, players.def2]],
    ];
    for (const [label, atkP, defP] of ruckSetups) {
        const rc = {fast:0, slow:0, turnover:0, penalty:0};
        for (let i = 0; i < n; i++) rc[resolveRuckContest(atkP, defP).outcome]++;
        lines.push(
            `${label}: fast ${(rc.fast/n*100).toFixed(1)}% | slow ${(rc.slow/n*100).toFixed(1)}% | ` +
            `turnover ${(rc.turnover/n*100).toFixed(1)}% | penalty ${(rc.penalty/n*100).toFixed(1)}%`
        );
    }

    // ── Fatigued vs fresh (A.4) — proves fatiguePenalty bites ──
    const fresh = Object.assign({}, players.atk1, {fatigue:0});
    const tired = Object.assign({}, players.atk1, {fatigue:100});
    let freshBreaks = 0, tiredBreaks = 0;
    for (let i = 0; i < n; i++) {
        if (resolveCarryContest(fresh, players.def2).outcome === "break") freshBreaks++;
        if (resolveCarryContest(tired, players.def2).outcome === "break") tiredBreaks++;
    }
    lines.push(
        `— Fatigue check — Curry vs Steward: fresh break ${(freshBreaks/n*100).toFixed(1)}% vs ` +
        `fatigued(100) break ${(tiredBreaks/n*100).toFixed(1)}% ` +
        `(contest -${fatiguePenalty(tired).toFixed(0)} pts, speed x${fatigueSpeedFactor(tired).toFixed(2)})`
    );

    const out = lines.join("\n");
    console.log(out);
    return out;
}
/* ═══════════════ PURE-ENGINE-END ═══════════════ */

// ── Pitch constants ──
const W = 800, H = 400;
const TRY_LINE_R = 740; // right try line (attacking direction)
const TRY_LINE_L = 60;
const canvas = document.getElementById("pitch");
const ctx = canvas.getContext("2d");

// ── State ──
let score = {blue:0, red:0};
let running = false;
let phase = "idle"; // idle, running, tackling, smash, rucking, passing, scoring, resetting
let carrier = null;  // player with ball
let support = null;  // support runner
let tackler = null;   // nearest defender
let cover = null;     // cover defender
let ballX = 0, ballY = 0; // ball position when not held
let supportSide = 1;       // which side the support runner holds depth on
let ruckX = 0, ruckY = 0;  // where the ruck formed
let ruckTimer = 0;         // frames left in the ruck contest
let ruckDefBonus = 0;      // defensive momentum carried into the ruck (big hit)
let coverContests = false; // did the cover defender arrive to contest?
let fastBall = false;      // last ruck produced quick ball

// Fatigue event costs (state layer — the pure block owns the penalties).
// Big collisions cost more than routine involvements.
const COST_CARRY = 6, COST_TACKLE = 6;       // routine carry / tackle
const COST_BIG_HIT = 10, COST_SMASHED = 8;   // dominant collision
const COST_BREAK_SPRINT = 4;                 // sprinting through the gap
const COST_RUCK = 7, COST_OFFLOAD = 2;       // ruck involvement / offload
const RECOVER_RATE = 0.08;                   // per idle/reset frame

const GROUND_FRAMES = 45; // how long a tackled player stays flattened
const DOMINANT_HIT_RUCK_BONUS = 12; // def momentum at the ruck after a smash

function addFatigue(p, amt) { p.fatigue = Math.min(100, (p.fatigue||0) + amt); }
function recoverFatigue(p, amt) { p.fatigue = Math.max(0, (p.fatigue||0) - amt); }

// Action queue — engine pushes, renderer consumes
let actionQueue = [];
let currentAction = null;
let actionTimer = 0;

// ── Commentary ──
function addComm(text, cls) {
    const el = document.createElement("div");
    el.className = "comm" + (cls?" "+cls:"");
    el.innerHTML = text;
    document.getElementById("comm").appendChild(el);
    document.getElementById("comm").scrollTop = 99999;
}
function flash(text, color) {
    const el = document.getElementById("flash");
    el.textContent = text;
    el.style.color = color||"white";
    el.classList.add("show");
    setTimeout(()=>el.classList.remove("show"), 2000);
}
function updateUI() {
    document.getElementById("score").textContent = `${score.blue} - ${score.red}`;
}

// ── Setup positions ──
function setupKickoff() {
    P.atk1.x = P.atk1.tx = 200; P.atk1.y = P.atk1.ty = 180;
    P.atk2.x = P.atk2.tx = 160; P.atk2.y = P.atk2.ty = 280;
    P.def1.x = P.def1.tx = 480; P.def1.y = P.def1.ty = 180;
    P.def2.x = P.def2.tx = 520; P.def2.y = P.def2.ty = 300;
    P.atk1.hasBall = true; P.atk2.hasBall = false;
    P.def1.hasBall = false; P.def2.hasBall = false;
    for (const p of all) { p.fatigue = 0; p.grounded = 0; }
    fastBall = false;
    carrier = P.atk1;
    support = P.atk2;
    tackler = P.def1;
    cover = P.def2;
    phase = "idle";
}

// ── Rendering ──
function drawPitch() {
    ctx.fillStyle = "#132a13";
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = "#2a5a2a"; ctx.lineWidth = 2;
    ctx.strokeRect(10,10,W-20,H-20);
    // Try lines
    ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2;
    ctx.beginPath();ctx.moveTo(TRY_LINE_L,10);ctx.lineTo(TRY_LINE_L,H-10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(TRY_LINE_R,10);ctx.lineTo(TRY_LINE_R,H-10);ctx.stroke();
    // Halfway
    ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = 1;
    ctx.beginPath();ctx.moveTo(W/2,10);ctx.lineTo(W/2,H-10);ctx.stroke();
}

function drawPlayer(p) {
    const r = 16;
    if (p.grounded > 0) {
        // A.2: tackled player is on the deck — flattened, dimmed
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, r*1.6, r*0.55, 0, 0, Math.PI*2);
        ctx.fillStyle = p.color; ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = "white"; ctx.font = "bold 9px Inter";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(p.num, p.x, p.y);
        ctx.restore();
    } else {
        // Glow if has ball
        if (p.hasBall) {
            ctx.beginPath(); ctx.arc(p.x,p.y,r+8,0,Math.PI*2);
            ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fill();
        }
        // Dot
        ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
        ctx.fillStyle = p.color; ctx.globalAlpha = p.hasBall ? 1 : 0.6;
        ctx.fill(); ctx.globalAlpha = 1;
        // Border
        ctx.strokeStyle = p.hasBall ? "white" : "rgba(255,255,255,0.2)";
        ctx.lineWidth = p.hasBall ? 2 : 1;
        ctx.stroke();
        // Number
        ctx.fillStyle = "white"; ctx.font = "bold 11px Inter";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(p.num, p.x, p.y);
    }
    // Name
    ctx.font = "9px Inter"; ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(p.name.split(" ").pop(), p.x, p.y + r + 12);
    // A.4: fatigue bar under the name — shows energy LEFT (shrinks as he tires)
    const fw = 26, fx = p.x - fw/2, fy = p.y + r + 18;
    const frac = (p.fatigue || 0) / 100;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(fx, fy, fw, 3);
    ctx.fillStyle = frac < 0.4 ? "#22c55e" : frac < 0.7 ? "#eab308" : "#ef4444";
    ctx.fillRect(fx, fy, fw * (1 - frac), 3);
}

function drawBall() {
    const bx = carrier ? carrier.x + 12 : ballX;
    const by = carrier ? carrier.y - 12 : ballY;
    ctx.beginPath(); ctx.arc(bx,by,5,0,Math.PI*2);
    ctx.fillStyle = "white"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bx,by,8,0,Math.PI*2); ctx.stroke();
}

// ── Smooth movement ──
function moveToward(p, speed) {
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 2) { p.x = p.tx; p.y = p.ty; return true; } // arrived
    const s = Math.min(speed, dist);
    p.x += (dx/dist) * s;
    p.y += (dy/dist) * s;
    return false;
}

// Fatigue-aware wrapper: tired players move slower (pure-block scale),
// grounded players crawl at half pace (being driven / getting up).
function movePlayer(p, speed) {
    let s = speed * fatigueSpeedFactor(p);
    if (p.grounded > 0) s *= 0.5;
    return moveToward(p, s);
}

// Per-frame housekeeping: grounded timers tick down, idle time recovers fatigue
function tickPlayers() {
    for (const p of all) {
        if (p.grounded > 0) p.grounded--;
        if (phase === "resetting" || phase === "idle") recoverFatigue(p, RECOVER_RATE);
    }
}

// ── Core game loop — runs every frame ──
let lastTime = 0;
const MOVE_SPEED = 2.5; // pixels per frame

function gameLoop(timestamp) {
    if (!running) { requestAnimationFrame(gameLoop); renderFrame(); return; }
    
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    tickPlayers();

    switch (phase) {
        case "running":
            doRunning();
            break;
        case "tackling":
            doTackling();
            break;
        case "smash":
            doSmash();
            break;
        case "rucking":
            doRucking();
            break;
        case "passing":
            doPassing();
            break;
        case "scoring":
            doScoring();
            break;
        case "resetting":
            doResetting();
            break;
        case "idle":
            // Start a new action
            startRun();
            break;
    }

    renderFrame();
    requestAnimationFrame(gameLoop);
}

function renderFrame() {
    ctx.clearRect(0,0,W,H);
    drawPitch();
    // Draw defenders first (behind)
    drawPlayer(P.def1); drawPlayer(P.def2);
    // Draw attackers on top
    drawPlayer(P.atk1); drawPlayer(P.atk2);
    drawBall();
}

// ═══ PHASE HANDLERS ═══

// 1. Carrier runs forward toward the defender line
function startRun() {
    phase = "running";
    supportSide = carrier.y > H/2 ? -1 : 1;
    // Carrier runs forward
    carrier.tx = Math.min(carrier.x + 200, TRY_LINE_R - 20);
    carrier.ty = carrier.y + (Math.random()-0.5) * 40;
    // (support + defender targets are updated every frame in doRunning)
    addComm(fastBall
        ? `Quick recycle — <b>${carrier.name}</b> hits the line again!`
        : `<b>${carrier.name}</b> carries the ball forward...`);
    fastBall = false;
}

// 2. Everyone moves — check if carrier reaches tackler
function doRunning() {
    // A.2: support runner holds depth — always 30-60px BEHIND the carrier,
    // tracking the carrier's y at a lateral offset, updated every frame
    support.tx = carrier.x - 45;
    support.ty = carrier.y + supportSide * 55;

    // A.2: tackler tracks the carrier laterally with a reaction lag —
    // higher Awareness = tighter tracking of the carrier's line
    const track = 0.02 + (tackler.awareness / 100) * 0.08;
    tackler.tx = carrier.x + 25;
    tackler.ty += (carrier.y - tackler.ty) * track;

    // Cover holds depth behind the tackler and marks the support runner
    const coverTrack = 0.02 + (cover.awareness / 100) * 0.06;
    cover.tx = tackler.x + 70;
    cover.ty += (support.y - cover.ty) * coverTrack;

    // Speeds trace to Pace; fatigue slows everyone (movePlayer)
    const carrierSpeed = MOVE_SPEED * (0.7 + carrier.pace / 200);
    const tacklerSpeed = MOVE_SPEED * (0.6 + tackler.pace / 250);
    const supportSpeed = MOVE_SPEED * (0.6 + support.pace / 250);

    movePlayer(carrier, carrierSpeed);
    movePlayer(support, supportSpeed);
    movePlayer(tackler, tacklerSpeed);
    movePlayer(cover, MOVE_SPEED * 0.7);

    // Depth rule: support must never get ahead of the carrier
    if (support.grounded <= 0 && support.x > carrier.x - 30) {
        support.x = Math.max(support.x - MOVE_SPEED, carrier.x - 30);
    }

    // Check if carrier and tackler are close enough for a contest
    const dx = carrier.x - tackler.x;
    const dy = carrier.y - tackler.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < 35) {
        // CONTACT! Resolve the tackle contest
        resolveTackle();
    }

    // Check try
    if (carrier.x >= TRY_LINE_R - 20) {
        phase = "scoring";
        addComm(`<b>TRY!</b> <b>${carrier.name}</b> touches down!`, "try");
        flash("TRY!", "#22c55e");
        score[[P.atk1, P.atk2].includes(carrier) ? "blue" : "red"] += 7; updateUI();
        actionTimer = 120; // frames to pause
    }
}

// 3. Tackle contest — stats vs stats
function resolveTackle() {
    const contest = resolveCarryContest(carrier, tackler);

    if (contest.outcome === "break") {
        // BEATEN! Carrier gets past — commentary reflects HOW he beat him
        if (contest.style === "power") {
            addComm(`<b>${carrier.name}</b> runs straight over <b>${tackler.name}</b>! Bounced off the tackle!`);
        } else {
            addComm(`<b>${carrier.name}</b> beats <b>${tackler.name}</b> with a brilliant step!`);
        }
        addFatigue(carrier, COST_BREAK_SPRINT);
        addFatigue(tackler, COST_TACKLE * 0.5); // missed but still worked
        // Carrier keeps going, tackler slides behind
        carrier.tx = Math.min(carrier.x + 150, TRY_LINE_R - 10);
        tackler.tx = carrier.x - 40;
        tackler.ty = carrier.y + 30;
        // Cover now has to come across
        cover.tx = carrier.tx + 20;
        cover.ty = carrier.ty;
        // Swap: cover becomes the new tackler
        const tmp = tackler;
        tackler = cover;
        cover = tmp;
        phase = "running"; // keep running at next defender
    }
    else if (contest.outcome === "tackled") {
        // CONTACT — carrier is held but can try to pass/offload.
        // A.2: both hit the deck — flattened, dimmed for GROUND_FRAMES
        addComm(`<b>${tackler.name}</b> tackles <b>${carrier.name}</b>! Can he get the pass away?`, "tackle");
        addFatigue(carrier, COST_CARRY);
        addFatigue(tackler, COST_TACKLE);
        carrier.grounded = GROUND_FRAMES;
        tackler.grounded = GROUND_FRAMES;
        phase = "tackling";
        actionTimer = 30; // brief pause in contact
        // Stop carrier movement
        carrier.tx = carrier.x;
        tackler.tx = tackler.x;
    }
    else {
        // SMASHED — dominant tackle, no chance to pass. Big hits cost more.
        addComm(`HUGE HIT from <b>${tackler.name}</b>! <b>${carrier.name}</b> is smashed backwards!`, "tackle");
        addFatigue(carrier, COST_SMASHED);
        addFatigue(tackler, COST_BIG_HIT);
        carrier.grounded = GROUND_FRAMES;
        tackler.grounded = GROUND_FRAMES;
        // Driven back before the ruck forms
        carrier.tx = carrier.x - 28;
        carrier.ty = carrier.y;
        tackler.tx = carrier.x - 12;
        tackler.ty = carrier.y;
        phase = "smash";
        actionTimer = 25;
    }
}

// 3b. Aftermath of a dominant hit — carrier driven back, then the ruck
// forms with the defence carrying momentum into it (A.3)
function doSmash() {
    actionTimer--;
    movePlayer(carrier, MOVE_SPEED * 0.9);
    movePlayer(tackler, MOVE_SPEED * 0.9);
    // Support and cover react toward the collision
    support.tx = carrier.x - 40; support.ty = carrier.y + supportSide * 30;
    cover.tx = carrier.x + 50; cover.ty = carrier.y;
    movePlayer(support, MOVE_SPEED * 0.8);
    movePlayer(cover, MOVE_SPEED * 0.8);
    if (actionTimer <= 0) startRuck(DOMINANT_HIT_RUCK_BONUS);
}

// 4. In the tackle — try to offload/pass
function doTackling() {
    actionTimer--;
    if (actionTimer > 0) return;

    // Does he even attempt it? Poor offloaders take the tackle instead.
    if (!chance(offloadAttemptChance(carrier))) {
        addComm(`<b>${carrier.name}</b> takes the tackle and sets up the ruck.`);
        startRuck(0);
        return;
    }

    // He's trying it — offload vs the tackler killing the ball
    const off = resolveOffloadContest(carrier, tackler);
    if (off.success) {
        // PASS AWAY! Ball goes to support runner
        addComm(`<b>${carrier.name}</b> gets the offload away to <b>${support.name}</b>!`);
        addFatigue(carrier, COST_OFFLOAD);
        carrier.hasBall = false;
        support.hasBall = true;
        // Swap roles
        const oldCarrier = carrier;
        carrier = support;
        support = oldCarrier;
        // New carrier runs at cover defender
        const tmp = tackler;
        tackler = cover;
        cover = tmp;

        phase = "passing";
        actionTimer = 0;
    } else {
        // Offload attempt killed by the tackler — ruck
        addComm(`<b>${carrier.name}</b> looks for the offload but <b>${tackler.name}</b> wraps him up.`);
        startRuck(0);
    }
}

// ═══ RUCK MICRO-LOOP (A.3) ═══
// Carrier + tackler converge over the ball; support (and cover, if he is
// near enough) race in to contest. resolveRuckContest (pure block) decides.
function startRuck(defBonus) {
    phase = "rucking";
    ruckDefBonus = defBonus || 0;
    ruckTimer = 60;
    ruckX = carrier.x; ruckY = carrier.y;
    // Bodies converge/overlap at the ball
    carrier.tx = ruckX - 6;  carrier.ty = ruckY;
    tackler.tx = ruckX + 6;  tackler.ty = ruckY;
    support.tx = ruckX - 26; support.ty = ruckY + 8;
    // Cover only contests if he is close enough to arrive in time
    const cdx = cover.x - ruckX, cdy = cover.y - ruckY;
    coverContests = Math.sqrt(cdx*cdx + cdy*cdy) < 150;
    if (coverContests) { cover.tx = ruckX + 26; cover.ty = ruckY - 8; }
    addComm(`Ruck forms over the ball — <b>${tackler.name}</b> competing...`);
}

function doRucking() {
    ruckTimer--;
    // Everyone piles toward the ruck
    movePlayer(carrier, MOVE_SPEED * 0.8);
    movePlayer(tackler, MOVE_SPEED * 0.8);
    movePlayer(support, MOVE_SPEED * (0.6 + support.pace / 250));
    if (coverContests) movePlayer(cover, MOVE_SPEED * (0.6 + cover.pace / 250));
    if (ruckTimer <= 0) resolveRuck();
}

function resolveRuck() {
    const atkP = [carrier, support];
    const defP = coverContests ? [tackler, cover] : [tackler];
    const res = resolveRuckContest(atkP, defP, ruckDefBonus);
    for (const p of atkP) addFatigue(p, COST_RUCK);
    for (const p of defP) addFatigue(p, COST_RUCK);

    fastBall = false;
    if (res.outcome === "penalty") {
        if (res.against === "defence") {
            addComm(`<b>PENALTY!</b> <b>${defP[defP.length-1].name}</b> won't release — the attack marches 80px upfield.`, "penalty");
            flash("PENALTY", "#eab308");
            // Attack advances; defensive line retreats and reforms
            carrier.tx = Math.min(carrier.x + 80, TRY_LINE_R - 60);
            carrier.ty = ruckY;
            tackler.tx = Math.min(carrier.tx + 140, TRY_LINE_R - 25); tackler.ty = ruckY;
            cover.tx = Math.min(carrier.tx + 190, TRY_LINE_R - 15);   cover.ty = ruckY + 80;
        } else {
            addComm(`<b>PENALTY against the attack!</b> Sealing off at the ruck — possession handed over.`, "penalty");
            flash("PENALTY", "#eab308");
            swapPossession();
        }
        phase = "resetting";
        actionTimer = res.speed;
    }
    else if (res.outcome === "turnover") {
        addComm(`<b>TURNOVER!</b> <b>${defP[0].name}</b> jackals it — steals the ball on the floor!`, "turnover");
        flash("TURNOVER", "#f97316");
        swapPossession();
        phase = "resetting";
        actionTimer = res.speed;
    }
    else {
        // Ball retained — ruck speed sets the tempo of the next carry
        fastBall = res.outcome === "fast";
        if (fastBall) {
            addComm(`<b>Quick ball!</b> <b>${carrier.name}</b> has it back in a flash.`);
        } else {
            addComm(`Slow ball... <b>${defP[0].name}</b> makes a mess of the ruck.`);
        }
        // Defensive line reforms in front of the ruck
        tackler.tx = Math.min(carrier.x + 150, TRY_LINE_R - 25); tackler.ty = ruckY;
        cover.tx = Math.min(carrier.x + 200, TRY_LINE_R - 15);   cover.ty = ruckY + (ruckY > H/2 ? -80 : 80);
        phase = "resetting";
        actionTimer = res.speed; // fast ball = shorter reset (A.3)
    }
}

// 5. Ball is being passed — animate it
function doPassing() {
    // Carrier (new) runs forward at the remaining defender
    carrier.tx = Math.min(carrier.x + 180, TRY_LINE_R - 20);
    carrier.ty = carrier.y + (Math.random()-0.5) * 30;
    tackler.tx = carrier.tx + 25;
    tackler.ty = carrier.ty;
    support.tx = carrier.x - 30;
    cover.tx = tackler.tx + 40;
    cover.ty = tackler.ty + 40;
    
    phase = "running"; // now running at new defender
    addComm(`<b>${carrier.name}</b> has the ball in space — running at <b>${tackler.name}</b>!`);
}

// 6. Try scored — pause then reset
function doScoring() {
    actionTimer--;
    carrier.tx = TRY_LINE_R;
    movePlayer(carrier, MOVE_SPEED);
    if (actionTimer <= 0) {
        phase = "resetting";
        actionTimer = 60;
        // After try, swap who attacks
        swapPossession();
    }
}

// 7. Reset positions for next phase — players actually walk into shape.
// After QUICK ball the support runner starts at ideal depth (45 behind);
// after slow ball he is deeper and has to work back up (A.3).
function doResetting() {
    actionTimer--;
    support.tx = carrier.x - (fastBall ? 45 : 75);
    support.ty = carrier.y + (carrier.y > H/2 ? -60 : 60);
    for (const p of all) movePlayer(p, MOVE_SPEED * 0.8);

    if (actionTimer <= 0) {
        phase = "idle"; // triggers next action
    }
}

function swapPossession() {
    // Flip who is attacking
    for (const p of all) p.hasBall = false;
    
    // Swap roles: defenders become attackers
    const wasAtk = [P.atk1, P.atk2].includes(carrier);
    if (wasAtk) {
        carrier = P.def1;
        support = P.def2;
        tackler = P.atk1;
        cover = P.atk2;
    } else {
        carrier = P.atk1;
        support = P.atk2;
        tackler = P.def1;
        cover = P.def2;
    }
    carrier.hasBall = true;
    
    // Flip positions — new attackers start left, defenders right
    carrier.tx = 200 + roll(60); carrier.ty = 150 + roll(100);
    support.tx = 160 + roll(40); support.ty = carrier.ty + (roll(2)===1 ? 90 : -90);
    tackler.tx = 480 + roll(40); tackler.ty = 170 + roll(60);
    cover.tx = 500 + roll(40); cover.ty = tackler.ty + 100;
    
    addComm(`Restart — <b>${carrier.name}</b> takes the ball.`);
}

// ── Controls ──
function startSim() {
    if (running) return;
    running = true;
    document.getElementById("btn-start").textContent = "Running...";
    setupKickoff();
    addComm(`Kick off! <b>${carrier.name}</b> carries for the blue team.`);
    updateUI();
}

function resetSim() {
    running = false;
    phase = "idle";
    score = {blue:0, red:0};
    setupKickoff();
    document.getElementById("comm").innerHTML = "";
    document.getElementById("btn-start").textContent = "Start";
    updateUI();
}

function setSpeed(ms) {
    // Adjust move speed — faster = bigger steps
    // Not used directly anymore since we're frame-based, but we can adjust MOVE_SPEED
    // For now this is a no-op placeholder
}

// ── Init ──
setupKickoff();
updateUI();
requestAnimationFrame(gameLoop);
</script>
