@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#0a0e13;--bg2:#12171e;--bg3:#1a2230;--bg4:#222d3a;--text1:#f0f4f8;--text2:#94a3b8;--text3:#4a5568;--accent:#3b82f6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--border:#1e293b;--team:#C8102E}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text1);min-height:100vh}

.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:1.1em;font-weight:700}
.topbar h1 span{color:var(--accent)}
.topbar .count{font-size:0.78em;color:var(--text3)}

.layout{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 49px)}

/* Squad list */
.squad-list{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:8px}
.squad-section{margin-bottom:12px}
.squad-section h3{font-size:0.65em;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:6px 10px}
.player-item{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:0.8em;transition:background 0.15s}
.player-item:hover{background:var(--bg3)}
.player-item.active{background:var(--bg4);border-left:3px solid var(--accent)}
.player-item .pos{color:var(--text3);font-weight:600;font-size:0.75em}

/* Player detail */
.detail{overflow-y:auto;padding:20px 24px}
.detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;border-left:4px solid var(--team);padding-left:16px}
.detail-name{font-size:1.6em;font-weight:800}
.detail-meta{font-size:0.8em;color:var(--text2);margin-top:4px}
.detail-meta span{margin-right:12px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.stat-card h2{font-size:0.68em;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.stat-card.wide{grid-column:span 2}

.s-row{display:flex;align-items:center;gap:6px;padding:2px 0}
.s-name{width:100px;font-size:0.72em;color:var(--text2);flex-shrink:0}
.s-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.s-fill{height:100%;border-radius:2px}
.s-val{width:24px;text-align:right;font-size:0.72em;font-weight:700;flex-shrink:0}

.hi .s-fill{background:var(--green)} .hi .s-val{color:var(--green)}
.gd .s-fill{background:var(--accent)} .gd .s-val{color:var(--accent)}
.md .s-fill{background:var(--yellow)} .md .s-val{color:var(--yellow)}
.lo .s-fill{background:var(--red)} .lo .s-val{color:var(--red)}

/* Hidden stats */
.hidden-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.h-item{text-align:center;padding:8px 4px;background:var(--bg3);border-radius:6px}
.h-label{font-size:0.6em;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.h-val{font-size:0.72em;font-weight:700}
.h-val.elite{color:var(--green)} .h-val.high{color:var(--accent)}
.h-val.medium{color:var(--yellow)} .h-val.low{color:var(--red)}

@media(max-width:700px){.layout{grid-template-columns:1fr}.squad-list{display:none}}
</style>
</head>

// ══ STAT DISPLAY CONFIG ══
const GROUPS = {
    "Physical": ["stopping_power","explosiveness","leg_drive","pace","acceleration","agility","strength"],
    "Mental": ["aggression","composure","concentration","awareness","running_lines","discipline","tenacity","scanning","positioning"],
    "Technical": ["long_passing","handling","high_ball","offload","tackling","rucking","mauling","jackling","grubber","chipping","box_kicking","stepping","short_passing","touch_finder"],
    "Set Piece": ["goal_kicking","scrum_drive","scrum_tech","jumping","lifting"],
};
const HIDDEN = ["consistency","big_game","injury_prone","dirtiness","work_rate","versatility","professionalism","ambition","loyalty","temperament"];
const LABELS = {stopping_power:"Stopping Power",explosiveness:"Explosiveness",leg_drive:"Leg Drive",pace:"Pace",acceleration:"Acceleration",agility:"Agility",strength:"Strength",aggression:"Aggression",composure:"Composure",concentration:"Concentration",awareness:"Awareness",running_lines:"Running Lines",discipline:"Discipline",tenacity:"Tenacity",scanning:"Scanning",positioning:"Positioning",long_passing:"Long Passing",handling:"Handling",high_ball:"High Ball",offload:"Offload",tackling:"Tackling",rucking:"Rucking",mauling:"Mauling",jackling:"Jackling",grubber:"Grubber",chipping:"Chipping",box_kicking:"Box Kicking",stepping:"Stepping",short_passing:"Short Passing",touch_finder:"Touch Finder",goal_kicking:"Goal Kicking",scrum_drive:"Scrum Drive",scrum_tech:"Scrum Tech",jumping:"Jumping",lifting:"Lifting",consistency:"Consistency",big_game:"Big Game",injury_prone:"Injury Prone",dirtiness:"Dirtiness",work_rate:"Work Rate",versatility:"Versatility",professionalism:"Professionalism",ambition:"Ambition",loyalty:"Loyalty",temperament:"Temperament"};

function tier(v){if(v>=80)return"hi";if(v>=60)return"gd";if(v>=40)return"md";return"lo"}
function hTier(v){return v.toLowerCase()}

function renderSquadList(){
    const el=document.getElementById("squad-list");
    const groups={"Front Row":["LH","HK","TH"],"Second Row":["LK"],"Back Row":["BF","OF","N8"],"Half Backs":["SH","FH"],"Centres":["IC","OC"],"Back Three":["LW","RW","FB"]};
    let html="";
    for(const[label,positions]of Object.entries(groups)){
        html+=`<div class="squad-section"><h3>${label}</h3>`;
        for(const p of SQUAD){
            if(positions.includes(p.posKey)){
                html+=`<div class="player-item" onclick="showPlayer(${p.num})" id="pi-${p.num}"><span>${p.name}</span><span class="pos">${p.posKey} #${p.num}</span></div>`;
            }
        }
        html+=`</div>`;
    }
    el.innerHTML=html;
}

function showPlayer(num){
    const p=SQUAD.find(x=>x.num===num);
    if(!p)return;
    // Highlight in list
    document.querySelectorAll(".player-item").forEach(e=>e.classList.remove("active"));
    const pi=document.getElementById("pi-"+num);
    if(pi)pi.classList.add("active");

    let html=`<div class="detail-header"><div><div class="detail-name">#${p.num} ${p.name}</div>
    <div class="detail-meta"><span>${p.pos}</span><span>${p.age} yrs</span><span>${p.nat}</span><span>${p.ht}cm / ${p.wt}kg</span><span>Wage: £${p.wage.toLocaleString()}/wk</span><span>Contract: ${p.contract_end}yr</span></div></div></div>`;

    // Status bar
    html+=`<div class="stat-grid"><div class="stat-card" style="grid-column:span 2"><div style="display:flex;gap:24px;justify-content:center">`;
    for(const[k,label]of[["form","Form"],["fitness","Fitness"],["morale","Morale"],["potential","Potential"]]){
        const v=p[k];const t=tier(v);
        html+=`<div style="text-align:center"><div style="font-size:0.62em;color:var(--text3);text-transform:uppercase;margin-bottom:2px">${label}</div><div class="s-val ${t}" style="font-size:1.1em">${v}</div></div>`;
    }
    html+=`</div></div></div>`;

    // Stat groups
    html+=`<div class="stat-grid">`;
    for(const[group,stats]of Object.entries(GROUPS)){
        html+=`<div class="stat-card"><h2>${group}</h2>`;
        for(const s of stats){
            const v=p[s]||0;const t=tier(v);
            html+=`<div class="s-row ${t}"><span class="s-name">${LABELS[s]||s}</span><div class="s-bar"><div class="s-fill" style="width:${v}%"></div></div><span class="s-val">${v}</span></div>`;
        }
        html+=`</div>`;
    }
    html+=`</div>`;

    // Hidden stats
    html+=`<div class="stat-card wide"><h2>Hidden Attributes</h2><div class="hidden-grid">`;
    for(const h of HIDDEN){
        const v=p[h]||"Medium";const cls=hTier(v);
        html+=`<div class="h-item"><div class="h-label">${LABELS[h]||h}</div><div class="h-val ${cls}">${v}</div></div>`;
    }
    html+=`</div></div>`;

    document.getElementById("detail").innerHTML=html;
}

renderSquadList();
