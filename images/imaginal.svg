<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2400" width="2400" height="2400">
  <defs>
    <radialGradient id="fogCenter" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3D2A7E" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#2D1A5E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1A0E3D" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="figureGlow" cx="50%" cy="60%" r="30%">
      <stop offset="0%" stop-color="#4A3A8E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1A0E3D" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="medBlur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="lightBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="wispBlur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="2400" height="2400" fill="#1A0E3D"/>
  <rect width="2400" height="2400" fill="url(#fogCenter)"/>

  <!-- Atmospheric fog layers -->
  <ellipse cx="800" cy="900" rx="900" ry="500" fill="#2D1A5E" opacity="0.15" filter="url(#softBlur)"/>
  <ellipse cx="1600" cy="1100" rx="700" ry="400" fill="#3D2A7E" opacity="0.1" filter="url(#softBlur)"/>
  <ellipse cx="1200" cy="1500" rx="1000" ry="300" fill="#2A1855" opacity="0.2" filter="url(#softBlur)"/>

  <!-- Ground plane - subtle -->
  <ellipse cx="1200" cy="1800" rx="1400" ry="200" fill="#251660" opacity="0.3" filter="url(#medBlur)"/>

  <!-- Seated figure silhouette -->
  <g opacity="0.7">
    <!-- Body/torso -->
    <ellipse cx="1200" cy="1500" rx="120" ry="180" fill="#1E0F4E" filter="url(#lightBlur)"/>
    <!-- Head -->
    <circle cx="1200" cy="1280" r="70" fill="#1E0F4E" filter="url(#lightBlur)"/>
    <!-- Legs (seated) -->
    <ellipse cx="1140" cy="1680" rx="80" ry="60" fill="#1E0F4E" filter="url(#lightBlur)"/>
    <ellipse cx="1260" cy="1680" rx="80" ry="60" fill="#1E0F4E" filter="url(#lightBlur)"/>
    <!-- Arms reaching slightly forward -->
    <ellipse cx="1050" cy="1450" rx="90" ry="40" fill="#1E0F4E" filter="url(#lightBlur)" transform="rotate(-15, 1050, 1450)"/>
    <ellipse cx="1350" cy="1450" rx="90" ry="40" fill="#1E0F4E" filter="url(#lightBlur)" transform="rotate(15, 1350, 1450)"/>
  </g>

  <!-- Wisps of failed visualisation - formless anxiety triggers -->
  <!-- Wisp 1: vague bus shape dissolving -->
  <path d="M600 700 Q700 650 800 700 Q850 720 850 780 Q850 840 800 860 Q700 900 600 860 Q550 840 550 780 Q550 720 600 700Z"
        fill="#4A3A8E" opacity="0.08" filter="url(#wispBlur)"/>

  <!-- Wisp 2: suggestion of people/crowd dissolving -->
  <ellipse cx="1600" cy="600" rx="200" ry="120" fill="#3D2A7E" opacity="0.06" filter="url(#wispBlur)"/>
  <circle cx="1550" cy="560" r="30" fill="#4A3A8E" opacity="0.05" filter="url(#wispBlur)"/>
  <circle cx="1620" cy="550" r="25" fill="#4A3A8E" opacity="0.04" filter="url(#wispBlur)"/>
  <circle cx="1680" cy="570" r="28" fill="#4A3A8E" opacity="0.04" filter="url(#wispBlur)"/>

  <!-- Wisp 3: formless shape upper left -->
  <path d="M300 400 Q450 350 500 450 Q520 550 400 550 Q280 530 300 400Z"
        fill="#352270" opacity="0.07" filter="url(#wispBlur)"/>

  <!-- Wisp 4: dissolving doorway shape -->
  <rect x="1700" y="900" width="150" height="250" rx="20" fill="#3A2875" opacity="0.05" filter="url(#wispBlur)"/>

  <!-- Wisp 5: vague classroom desks -->
  <rect x="400" y="1100" width="200" height="30" rx="5" fill="#3D2A7E" opacity="0.04" filter="url(#wispBlur)"/>
  <rect x="450" y="1050" width="200" height="30" rx="5" fill="#3D2A7E" opacity="0.03" filter="url(#wispBlur)"/>

  <!-- Subtle emanation from figure - trying to visualize -->
  <ellipse cx="1200" cy="1100" rx="300" ry="200" fill="url(#figureGlow)" filter="url(#medBlur)"/>

  <!-- Very faint particles drifting -->
  <circle cx="900" cy="500" r="3" fill="#6B5BA0" opacity="0.15"/>
  <circle cx="1500" cy="400" r="2" fill="#6B5BA0" opacity="0.1"/>
  <circle cx="700" cy="800" r="4" fill="#5A4A90" opacity="0.08"/>
  <circle cx="1700" cy="750" r="3" fill="#5A4A90" opacity="0.12"/>
  <circle cx="1000" cy="300" r="2" fill="#6B5BA0" opacity="0.1"/>
  <circle cx="1400" cy="900" r="3" fill="#5A4A90" opacity="0.06"/>

  <!-- Top fog layer -->
  <rect x="0" y="0" width="2400" height="600" fill="#1A0E3D" opacity="0.3" filter="url(#softBlur)"/>

  <!-- Bottom fog -->
  <rect x="0" y="1800" width="2400" height="600" fill="#1A0E3D" opacity="0.5" filter="url(#softBlur)"/>
</svg>